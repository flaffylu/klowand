name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: AAB bauen (unsigniert, wird danach mit dem Upload-Schlüssel signiert)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/
      - name: Ergebnis in Branch android-build ablegen
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan android-build && git rm -rq --cached . && git clean -fdxq -e android
          cp /tmp/out/app-release-unsigned.aab . && echo "${GITHUB_SHA}" > built-from.txt
          git add app-release-unsigned.aab built-from.txt && git commit -qm "AAB aus ${GITHUB_SHA}"
          git push -f origin android-build
