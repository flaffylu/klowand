<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video-Chat · Klo-Wand</title>
<meta name="theme-color" content="#120c1a">
<meta name="color-scheme" content="only dark">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#120c1a;--card:#1d1529;--line:#2e2440;--tx:#f4eefb;--mu:#b9adc9;--acc:#ff4fa3;--hi:#ffd166;--red:#d93a3a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--f-ui,"Barlow Condensed",system-ui,sans-serif)}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
header a{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:1.3rem}
header h1{margin:0;flex:1;font:400 1.6rem/1 var(--f-marker,"Permanent Marker",cursive);color:var(--hi)}
header .cnt{font:700 .95rem var(--f-ui);color:var(--mu)}
main{padding:0 12px calc(110px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.grid.n1{grid-template-columns:1fr}.grid.n2{grid-template-columns:1fr}
@media (min-width:640px){.grid.n2{grid-template-columns:1fr 1fr}}
.tile{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
@media (min-width:640px){.tile{aspect-ratio:4/3}}
.grid.n1 .tile{aspect-ratio:3/4;max-height:72vh;margin:0 auto;width:100%}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile.me video{transform:scaleX(-1)}
.tile.me.env video{transform:none}
.tile .nm{position:absolute;left:8px;bottom:8px;font:700 .95rem var(--f-ui);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px}
.tile .st{position:absolute;inset:0;display:grid;place-items:center;font:600 1rem var(--f-ui);color:var(--mu);text-align:center;padding:12px}
.tile .muted{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 8px;font-size:.9rem}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(18,12,26,0),rgba(18,12,26,.95) 35%)}
.bar button{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:1.5rem;cursor:pointer;display:grid;place-items:center}
.bar button[aria-pressed=false]{background:#4a3d5e}
.bar button.end{background:var(--red);border-color:var(--red);width:72px;border-radius:30px}
.card{max-width:560px;margin:10px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{margin:0 0 8px;font:700 1.4rem var(--f-ui)}
.card p{margin:8px 0;font:500 1.05rem/1.4 var(--f-ui);color:var(--mu)}
.card p b{color:var(--tx)}
.card .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;margin-top:12px;border:none;border-radius:14px;background:var(--acc);color:#fff;font:700 1.2rem var(--f-ui);cursor:pointer}
.card .go.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}
.card input{width:100%;min-height:48px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:#120c1a;color:var(--tx);font:600 1.1rem var(--f-ui);padding:0 12px}
.card label{font:700 .85rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.card ul{margin:8px 0;padding-left:20px;color:var(--mu);font:500 1rem/1.45 var(--f-ui)}
.err{color:#ff9b9b!important}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a href="index.html" id="back" aria-label="Zurück zur Wand">←</a><h1>Video-Chat</h1><span class="cnt" id="cnt"></span></header>
<main>
  <section class="card" id="lobby">
    <h2 id="lt">📹 Video-Chat für eure Gruppe</h2>
    <div id="lmsg"></div>
    <div id="joinBox" hidden>
      <label for="nm">Dein Name im Chat</label>
      <input id="nm" maxlength="12" autocomplete="nickname">
      <button type="button" class="go" id="join">📹 Video-Chat betreten</button>
      <p>Bis zu 6 Leute gleichzeitig. Bild und Ton gehen direkt von Handy zu Handy und werden nirgends gespeichert.</p>
    </div>
    <div id="testBox" hidden>
      <button type="button" class="go sec" id="test">🎥 Kamera und Mikro testen</button>
      <button type="button" class="go" id="buy" hidden>Eigene private Wand holen</button>
    </div>
    <p class="err" id="lerr" hidden></p>
  </section>
  <div class="grid" id="grid" hidden></div>
</main>
<div class="bar" id="bar" hidden>
  <button type="button" id="bMic" aria-pressed="true" aria-label="Mikrofon an/aus">🎙️</button>
  <button type="button" id="bCam" aria-pressed="true" aria-label="Kamera an/aus">📷</button>
  <button type="button" id="bFlip" aria-label="Kamera wechseln">🔄</button>
  <button type="button" class="end" id="bEnd" aria-label="Auflegen">📞</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="lang.js"></script>
<script src="config.js"></script>
<script src="filter.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  const q = new URLSearchParams(location.search);
  const WALL = (q.get("wand") || "demo").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 60) || "demo";
  let KEY = null; try { const k = q.get("k"); KEY = /^[A-Za-z0-9]{24,40}$/.test(k || "") ? k : localStorage.getItem("klowand-fam-" + WALL); if (!/^[A-Za-z0-9]{24,40}$/.test(KEY || "")) KEY = null; } catch (e) {}
  $("back").href = "index.html?wand=" + encodeURIComponent(WALL);
  const MAX = 6, STUN = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }];

  // Ohne geheimen Code (öffentliche Wände, Demo): kein Video-Chat mit Fremden – nur Kamera testen
  if (!KEY) {
    $("lt").textContent = "📹 Video-Chat mit Freunden";
    $("lmsg").innerHTML = `<p>Mit eurer <b>eigenen privaten Klo-Wand</b> könnt ihr mit Familie und Freunden per Video quatschen – bis zu 6 Leute gleichzeitig.</p>
      <ul><li>Nur wer euren geheimen Code hat, kommt rein – keine Fremden.</li><li>Bild und Ton gehen direkt von Handy zu Handy, nichts wird gespeichert.</li><li>Mikro und Kamera jederzeit an- und ausschaltbar.</li></ul>
      <p>Auf den öffentlichen Wänden gibt es aus Sicherheitsgründen keinen Video-Chat. Hier kannst du nur deine Kamera testen.</p>`;
    $("testBox").hidden = false;
    if (!(typeof KLO_APP !== "undefined" && KLO_APP)) { $("buy").hidden = false; $("buy").onclick = () => { location.href = "index.html?wand=" + encodeURIComponent(WALL) + "&holen=1"; }; }
    $("test").onclick = async () => { try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); showGrid(); addTile("me", "Du (Test)", s, true); $("bar").hidden = false; local = s; $("bEnd").onclick = () => { s.getTracks().forEach(t => t.stop()); location.reload(); }; wireButtons(); }
      catch (e) { err("Ohne Erlaubnis für Kamera und Mikrofon geht es nicht. Du kannst sie in den Browser-Einstellungen erlauben."); } };
    window.__vc = { mode: "test" };
  }

  function err(t) { $("lerr").hidden = false; $("lerr").textContent = t; }
  function showGrid() { $("lobby").hidden = true; $("grid").hidden = false; }
  function layout() { const n = $("grid").children.length; $("grid").className = "grid n" + Math.min(n, 3); $("cnt").textContent = KEY && n ? n + " / " + MAX : ""; }
  function addTile(id, name, stream, me) {
    let t = $("t-" + id);
    if (!t) { t = document.createElement("div"); t.className = "tile" + (me ? " me" : ""); t.id = "t-" + id;
      t.innerHTML = `<video autoplay playsinline ${me ? "muted" : ""}></video><span class="st">Verbinde …</span><span class="nm">${E(name)}</span>`; $("grid").appendChild(t); }
    if (stream) { const v = t.querySelector("video"); if (v.srcObject !== stream) v.srcObject = stream; t.querySelector(".st").hidden = true; v.play && v.play().catch(() => {}); }
    layout(); return t;
  }
  function dropTile(id) { const t = $("t-" + id); if (t) t.remove(); layout(); }

  let local = null, facing = "user";
  function wireButtons() {
    $("bMic").onclick = () => { const on = $("bMic").getAttribute("aria-pressed") !== "true"; local.getAudioTracks().forEach(t => t.enabled = on); $("bMic").setAttribute("aria-pressed", on); $("bMic").textContent = on ? "🎙️" : "🔇"; };
    $("bCam").onclick = () => { const on = $("bCam").getAttribute("aria-pressed") !== "true"; local.getVideoTracks().forEach(t => t.enabled = on); $("bCam").setAttribute("aria-pressed", on); };
    $("bFlip").onclick = async () => {
      facing = facing === "user" ? "environment" : "user";
      try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } }); const nt = s.getVideoTracks()[0], old = local.getVideoTracks()[0];
        Object.values(peers).forEach(p => { const sd = p.pc.getSenders().find(x => x.track && x.track.kind === "video"); sd && sd.replaceTrack(nt); });
        local.removeTrack(old); old.stop(); local.addTrack(nt); const me = $("t-me"); me.classList.toggle("env", facing === "environment"); me.querySelector("video").srcObject = local; } catch (e) {}
    };
  }
  if (!KEY) return;

  /* ---------- Private Wand: echter Video-Chat ---------- */
  firebase.initializeApp(firebaseConfig);
  const fs = firebase.firestore(), grp = fs.collection("walls").doc(WALL).collection("familie").doc(KEY);
  const TS = () => firebase.firestore.FieldValue.serverTimestamp();
  const ME = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 57]).join("");
  let name = ""; try { name = localStorage.getItem("klowand-chillname") || ""; } catch (e) {}
  $("nm").value = name; $("joinBox").hidden = false;
  $("lmsg").innerHTML = `<p>Nur wer euren geheimen Code hat, kann hier rein.</p>`;
  const okName = n => /^[A-Za-z0-9ÄÖÜäöüß ._-]{2,12}$/.test(n) && !(window.KloFilter && KloFilter.reason(n, true));
  const peers = {}; let present = {}, joined = false, unP = null, unS = null, hb = null;
  window.__vc = { mode: "live", peers, me: ME };

  $("join").onclick = async () => {
    const n = $("nm").value.trim(); if (!okName(n)) { err("Bitte 2–12 Buchstaben oder Zahlen als Name."); return; }
    name = n; try { localStorage.setItem("klowand-chillname", n); } catch (e) {}
    try { local = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { err("Ohne Erlaubnis für Kamera und Mikrofon geht es nicht. Du kannst sie in den Browser-Einstellungen erlauben."); return; }
    const snap = await grp.collection("call").get().catch(() => null);
    const live = snap ? snap.docs.filter(d => fresh(d.data())).length : 0;
    if (live >= MAX) { local.getTracks().forEach(t => t.stop()); err(`Der Video-Chat ist voll (${MAX} Leute). Versuch es gleich nochmal.`); return; }
    joined = true; showGrid(); addTile("me", name + " (du)", local, true); $("bar").hidden = false; wireButtons();
    $("bEnd").onclick = leave;
    const beat = () => grp.collection("call").doc(ME).set({ n: name, ts: TS() }).catch(() => {});
    beat(); hb = setInterval(beat, 10000);
    unP = grp.collection("call").onSnapshot(s => { present = {}; s.docs.forEach(d => { if (d.id !== ME && fresh(d.data())) present[d.id] = d.data().n; }); sync(); }, () => {});
    unS = grp.collection("sig").where("t", "==", ME).onSnapshot(s => s.docChanges().forEach(c => { if (c.type === "added") { onSig(c.doc.data()); c.doc.ref.delete().catch(() => {}); } }), () => {});
  };
  const fresh = d => !d.ts || (d.ts.toMillis && Date.now() - d.ts.toMillis() < 35000);

  function sync() {
    Object.keys(present).forEach(id => { if (!peers[id] && ME < id) connect(id, true); if (peers[id]) peers[id].name = present[id]; });
    Object.keys(peers).forEach(id => { if (!present[id]) close(id); });
  }
  function mkPeer(id) {
    const pc = new RTCPeerConnection({ iceServers: STUN }), p = peers[id] = { pc, name: present[id] || "Freund" };
    local.getTracks().forEach(t => pc.addTrack(t, local));
    const t = addTile(id, p.name, null);
    pc.ontrack = e => addTile(id, p.name, e.streams[0]);
    pc.onconnectionstatechange = () => { const st = t.querySelector(".st");
      if (pc.connectionState === "failed") { st.hidden = false; st.textContent = "Verbindung klappt nicht – das Netz blockiert evtl. Video. WLAN probieren."; }
      if (pc.connectionState === "disconnected") { st.hidden = false; st.textContent = "Verbindung weg …"; }
      if (pc.connectionState === "connected") st.hidden = true; };
    return p;
  }
  // Ohne Trickle: erst alle Verbindungswege sammeln, dann eine Nachricht schicken
  const gathered = pc => new Promise(r => { if (pc.iceGatheringState === "complete") return r(); const f = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", f); r(); } }; pc.addEventListener("icegatheringstatechange", f); setTimeout(r, 3000); });
  const send = (to, k, d) => grp.collection("sig").add({ f: ME, t: to, k, d: d || "", ts: TS() }).catch(() => {});
  async function connect(id) {
    const p = mkPeer(id); await p.pc.setLocalDescription(await p.pc.createOffer()); await gathered(p.pc);
    send(id, "offer", JSON.stringify(p.pc.localDescription));
  }
  async function onSig(m) {
    if (!joined || !m || !m.f) return;
    if (m.k === "bye") return close(m.f);
    if (m.k === "offer") { if (peers[m.f]) close(m.f); const p = mkPeer(m.f); await p.pc.setRemoteDescription(JSON.parse(m.d)); await p.pc.setLocalDescription(await p.pc.createAnswer()); await gathered(p.pc); send(m.f, "answer", JSON.stringify(p.pc.localDescription)); }
    if (m.k === "answer" && peers[m.f]) { try { await peers[m.f].pc.setRemoteDescription(JSON.parse(m.d)); } catch (e) {} }
  }
  function close(id) { const p = peers[id]; if (p) { try { p.pc.close(); } catch (e) {} delete peers[id]; } dropTile(id); }
  async function leave() {
    joined = false; clearInterval(hb); unP && unP(); unS && unS();
    Object.keys(peers).forEach(id => { send(id, "bye"); close(id); });
    local && local.getTracks().forEach(t => t.stop());
    await grp.collection("call").doc(ME).delete().catch(() => {});
    location.href = "index.html?wand=" + encodeURIComponent(WALL);
  }
  addEventListener("pagehide", () => { if (joined) { Object.keys(peers).forEach(id => send(id, "bye")); grp.collection("call").doc(ME).delete().catch(() => {}); } });
})();
</script>
</body>
</html>
