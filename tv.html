<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klo-Wand · TV</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#120c1a;--card:#1f1630;--y:#ffd166;--p:#ff4fa3;--c:#7ad7ff;--l:#c6ff6a;--t:#fff7ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:"Barlow Condensed",system-ui,sans-serif;overflow:hidden}
.tv{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;gap:1.4vw;height:100vh;padding:1.6vw}
header{grid-column:1/3;display:flex;align-items:center;gap:1.4vw}
.logo{font:400 3.2vw/1 "Permanent Marker",cursive;color:var(--y);background:var(--card);padding:.5vw 1.2vw;border-radius:1vw}
.venue{font:700 2.6vw/1 "Barlow Condensed";flex:1}
.venue small{display:block;font:600 1.3vw "Barlow Condensed";color:#cbbfd9;margin-top:.3vw}
.clock{font:700 2.6vw "Barlow Condensed";color:var(--c)}
.wall{position:relative;background:repeating-linear-gradient(0deg,#1b1326 0 4.4vw,#21172f 4.4vw 4.5vw);border-radius:1.4vw;overflow:hidden;padding:1.2vw;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:1.1vw;align-content:start}
.note{background:var(--t);color:#1b1424;border-radius:.8vw;padding:1vw 1.1vw .7vw;font:400 1.7vw/1.15 "Permanent Marker",cursive;box-shadow:0 .5vw 1.2vw rgba(0,0,0,.4);overflow-wrap:anywhere;animation:pop .6s ease-out both}
.note:nth-child(3n+1){background:#ffe9a8}.note:nth-child(3n+2){background:#ffd3e6}.note:nth-child(4n){background:#d4f1ff}
.note img{width:100%;border-radius:.5vw;background:#fff}
.note small{display:block;font:700 1vw "Barlow Condensed";color:#6b5a77;margin-top:.5vw}
.note.hot{outline:.35vw solid var(--p);transform:scale(1.03)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.side{display:flex;flex-direction:column;gap:.8vw;min-height:0;overflow:hidden}
.card{background:var(--card);border-radius:1.2vw;padding:.8vw 1.1vw}
.card h2{margin:0 0 .6vw;font:700 1.15vw "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.fq{font:400 1.45vw/1.15 "Permanent Marker",cursive;margin-bottom:.8vw}
.bar{position:relative;height:2.4vw;border-radius:.8vw;background:#2c2140;margin-top:.5vw;overflow:hidden;display:flex;align-items:center;padding:0 1vw;font:700 1.5vw "Barlow Condensed"}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--p);transition:width 1s;opacity:.85}
.bar span{position:relative;flex:1}.bar b{position:relative}
.bar.b i{background:var(--c)}
ol{margin:0;padding:0;list-style:none;display:grid;gap:.45vw}
ol li{display:flex;gap:.8vw;align-items:center;background:#2c2140;border-radius:.7vw;padding:.3vw .9vw;font:700 1.25vw "Barlow Condensed"}
ol li .n{min-width:2.6vw;text-align:center;color:var(--l);font-size:1.6vw}
ol li .x{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qq{font:700 1.75vw/1.15 "Barlow Condensed";margin-bottom:.6vw}
.qo{display:grid;gap:.45vw}
.qo div{background:#2c2140;border-radius:.7vw;padding:.35vw .9vw;font:700 1.3vw "Barlow Condensed"}
.qo div.ok{background:#2f8f4f}
.qt{height:.6vw;border-radius:.3vw;background:#2c2140;overflow:hidden;margin-top:.6vw}.qt i{display:block;height:100%;background:var(--y)}
.join{display:flex;gap:1vw;align-items:center;text-align:right}
.join canvas{width:7vw;height:7vw;border-radius:.8vw;background:#fff;flex:none}
.join b{display:block;font:400 2vw/1.05 "Permanent Marker",cursive;color:var(--y)}
.join span{font:600 1.2vw "Barlow Condensed";color:#cbbfd9}
.fsbtn{position:fixed;right:1vw;bottom:1vw;opacity:.35;background:#2c2140;color:#fff;border:none;border-radius:.6vw;padding:.5vw .9vw;font:700 1vw "Barlow Condensed";cursor:pointer}
.fsbtn:hover{opacity:1}
.empty{grid-column:1/4;font:400 2vw "Permanent Marker",cursive;color:#cbbfd9;text-align:center;margin-top:8vw}
@media (orientation:portrait){.tv{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}header{grid-column:1}.wall{grid-template-columns:repeat(2,1fr)}
  .logo,.venue,.clock{font-size:5vw}.venue small{font-size:2.6vw}.note{font-size:3.4vw}.card h2{font-size:2.4vw}.fq{font-size:3.4vw}.bar,.qo div,ol li{font-size:3vw}.bar{height:6vw}.qq{font-size:3.4vw}.join canvas{width:18vw;height:18vw}.join b{font-size:4vw}.join span{font-size:2.4vw}}
</style>
</head>
<body>
<div class="tv">
  <header><div class="logo">Klo-Wand</div><div class="venue" id="venue">…<small id="vsub">Live-Wand · schreib vom Handy mit</small></div><div class="join"><div><b>Scannen &amp; mitmachen!</b><span>Schreiben · abstimmen · Quiz · Lieder wünschen</span></div><canvas id="qr" width="300" height="300"></canvas></div><div class="clock" id="clock"></div></header>
  <section class="wall" id="wall" aria-live="polite"><p class="empty">Wand wird geladen …</p></section>
  <aside class="side">
    <div class="card"><h2>🚽 Klo-Frage des Tages</h2><div class="fq" id="fq"></div><div class="bar" id="fa"><i></i><span></span><b></b></div><div class="bar b" id="fb"><i></i><span></span><b></b></div></div>
    <div class="card" id="qzCard"><h2>🧠 Quiz-Abend · mitspielen am Handy</h2><div class="qq" id="qq"></div><div class="qo" id="qo"></div><div class="qt"><i id="qt"></i></div></div>
    <div class="card"><h2>🏆 Quiz-Rangliste heute</h2><ol id="rk"><li><span class="x">Noch niemand</span></li></ol></div>
    <div class="card"><h2>🎵 Musikwünsche · Top 5</h2><ol id="wu"><li><span class="x">Noch keine Wünsche</span></li></ol></div>
  </aside>
</div>
<button class="fsbtn" id="fs" type="button">⛶ Vollbild</button>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="mehr-daten.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  const q = new URLSearchParams(location.search);
  const WALL = (q.get("wand") || "demo").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 60) || "demo";
  const JOIN = "https://flaffylu.github.io/klowand/?wand=" + encodeURIComponent(WALL);
  // QR-Code zum Mitmachen
  (function () { const c = $("qr").getContext("2d"), qq = qrcode(0, "M"); qq.addData(JOIN); qq.make(); const n = qq.getModuleCount(), m = 300 / (n + 4);
    c.fillStyle = "#fff"; c.fillRect(0, 0, 300, 300); c.fillStyle = "#120c1a"; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qq.isDark(r, k)) c.fillRect((k + 2) * m, (r + 2) * m, Math.ceil(m), Math.ceil(m)); })();
  setInterval(() => $("clock").textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }), 1000);
  $("fs").onclick = () => { try { document.documentElement.requestFullscreen(); } catch (e) {} };
  // Bildschirm wach halten
  (async function wake() { try { const l = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); }, { once: true }); } catch (e) {} })();

  firebase.initializeApp(firebaseConfig);
  const fs = firebase.firestore(), base = fs.collection("walls").doc(WALL);
  const W = (typeof WAENDE !== "undefined" && WAENDE[WALL]) || null;
  $("venue").firstChild.textContent = W ? W.name : "Klo-Wand";
  if (!W) base.get().then(d => { if (d.exists && d.data().name) $("venue").firstChild.textContent = d.data().name; }).catch(() => {});
  const closed = () => { $("wall").innerHTML = `<p class="empty">Diese Wand ist privat – der TV-Modus geht nur bei öffentlichen Wänden.</p>`; };

  // Live-Wand
  const since = firebase.firestore.Timestamp.fromMillis(Date.now() - 21 * 864e5);
  let posts = [], likes = {}, first = true, hot = null;
  const draw = () => {
    const list = posts.map(p => ({ ...p, n: (likes[p.id] || 0) })).slice(0, 12);
    $("wall").innerHTML = list.length ? list.map(p => `<div class="note${p.id === hot ? " hot" : ""}">${p.img ? `<img src="${p.img}" alt="Kritzelei">` : E(p.t)}<small>${p.n ? "|".repeat(Math.min(p.n, 10)) + " " + p.n : "neu"}</small></div>`).join("")
      : `<p class="empty">Die Wand ist noch sauber.<br>Scanne den Code und schreib das Erste drauf!</p>`;
  };
  base.collection("posts").where("ts", ">", since).orderBy("ts", "desc").limit(40).onSnapshot(s => {
    posts = s.docs.map(d => { const x = d.data(); return { id: d.id, t: x.t, img: typeof x.img === "string" && x.img.startsWith("data:image/png") ? x.img : null }; });
    if (!first) s.docChanges().forEach(c => { if (c.type === "added") { hot = c.doc.id; setTimeout(() => { hot = null; draw(); }, 8000); } });
    first = false; draw();
  }, closed);
  base.collection("likes").where("ts", ">", since).limit(5000).onSnapshot(s => { likes = {}; s.docs.forEach(d => { const p = d.data().p; likes[p] = (likes[p] || 0) + 1; }); draw(); }, () => {});

  // Klo-Frage
  const F = kloFrage(), day = kloDay();
  $("fq").textContent = F[0];
  const bars = (a, b) => { const s = a + b; [[$("fa"), a, F[1]], [$("fb"), b, F[2]]].forEach(([el, n, t]) => { el.querySelector("i").style.width = (s ? n / s * 100 : 0) + "%"; el.querySelector("span").textContent = t; el.querySelector("b").textContent = s ? Math.round(n / s * 100) + "%" : "–"; }); };
  bars(0, 0);
  base.collection("umfrage").where("d", "==", day).limit(5000).onSnapshot(s => { let a = 0, b = 0; s.docs.forEach(d => { d.data().a === 1 ? b++ : a++; }); bars(a, b); }, () => {});

  // Quiz im Takt mit allen Handys
  let lastI = -1;
  setInterval(() => {
    const x = KLO_QZ.at(Date.now());
    if (x.i !== lastI) { lastI = x.i; $("qq").textContent = x.q; $("qo").innerHTML = x.o.map((o, k) => `<div data-k="${k}">${["A", "B", "C"][k]}: ${E(o)}</div>`).join(""); }
    $("qo").querySelectorAll("div").forEach(d => d.classList.toggle("ok", !x.open && +d.dataset.k === x.right));
    $("qt").style.width = (x.open ? x.left / KLO_QZ.ASK * 100 : 0) + "%";
  }, 250);
  base.collection("quiz").where("d", "==", day).limit(500).onSnapshot(s => {
    const rows = s.docs.map(d => d.data()).filter(r => typeof r.p === "number").sort((a, b) => b.p - a.p).slice(0, 3);
    $("rk").innerHTML = rows.length ? rows.map((r, i) => `<li><span class="n">${["🥇", "🥈", "🥉"][i] || i + 1}</span><span class="x">${E(r.n)}</span><b>${r.p}</b></li>`).join("") : `<li><span class="x">Noch niemand – scannen und mitspielen!</span></li>`;
  }, () => {});

  // Musikwünsche Top 5 (letzte 12 Stunden)
  const ws = firebase.firestore.Timestamp.fromMillis(Date.now() - 12 * 36e5);
  let wish = [], votes = {};
  const wdraw = () => { const l = wish.map(w => ({ ...w, n: votes[w.id] || 0 })).sort((a, b) => b.n - a.n).slice(0, 5);
    $("wu").innerHTML = l.length ? l.map((w, i) => `<li><span class="n">${w.n}</span><span class="x">${E(w.t)}</span></li>`).join("") : `<li><span class="x">Noch keine Wünsche – am Handy unter „Musikwünsche“</span></li>`; };
  base.collection("wunsch").where("ts", ">", ws).orderBy("ts", "desc").limit(100).onSnapshot(s => { wish = s.docs.map(d => ({ id: d.id, t: d.data().t })); wdraw(); }, () => {});
  base.collection("wunschja").where("ts", ">", ws).limit(3000).onSnapshot(s => { votes = {}; s.docs.forEach(d => { const p = d.data().p; votes[p] = (votes[p] || 0) + 1; }); wdraw(); }, () => {});
})();
</script>
</body>
</html>
